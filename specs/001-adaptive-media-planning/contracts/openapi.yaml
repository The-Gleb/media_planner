openapi: 3.1.2
info:
  title: Media Planner Simulator API
  version: 0.2.0
  description: >-
    Contract for a seeded, hourly advertising-world simulator. Money uses decimal strings and
    counts use signed 64-bit integers constrained to non-negative values.
servers:
  - url: http://127.0.0.1:8080
    description: Local Docker Compose host port
  - url: http://simulator:8080
    description: Docker Compose service network
tags:
  - name: Simulations
  - name: World
  - name: Health
paths:
  /v1/world-metadata:
    get:
      tags: [World]
      operationId: getWorldMetadata
      summary: Return immutable public metadata needed to configure a campaign
      description: Hidden rates, capacities, profiles, drift and shocks are not exposed.
      responses:
        '200':
          description: Loaded world metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldMetadata'
        '503':
          description: Service is not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/simulations/{simulation_id}:
    put:
      tags: [Simulations]
      operationId: resetSimulation
      summary: Create or atomically reset a simulation
      description: >-
        In strict mode, creation requires If-None-Match: * and reset of the same resource requires
        its current If-Match ETag. Local Compose relaxes these preconditions. At most one simulation
        resource may exist in v0.
      parameters:
        - name: simulation_id
          in: path
          required: true
          description: Planner-assigned simulation identifier.
          schema:
            $ref: '#/components/schemas/SimulationID'
        - $ref: '#/components/parameters/IfMatchOptional'
        - $ref: '#/components/parameters/IfNoneMatchOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationConfig'
            examples:
              weekCampaign:
                value:
                  world_seed: '42001'
                  campaign_seed: '77001'
                  start_hour: '2026-09-03T06:00:00Z'
                  duration_hours: 168
                  time_zone: Europe/Moscow
      responses:
        '200':
          description: Existing simulation reset atomically
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationState'
        '201':
          description: Simulation created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Simulations]
      operationId: deleteSimulation
      summary: Delete an in-memory simulation
      parameters:
        - name: simulation_id
          in: path
          required: true
          description: Planner-assigned simulation identifier.
          schema:
            $ref: '#/components/schemas/SimulationID'
        - $ref: '#/components/parameters/IfMatchRequired'
      responses:
        '204':
          description: Simulation deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /v1/simulations/{simulation_id}/current-hour:
    get:
      tags: [Simulations]
      operationId: getCurrentHour
      summary: Return the next hour not yet simulated
      parameters:
        - name: simulation_id
          in: path
          required: true
          description: Planner-assigned simulation identifier.
          schema:
            $ref: '#/components/schemas/SimulationID'
      responses:
        '200':
          description: Current simulation position
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentHour'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
  /v1/simulations/{simulation_id}/steps:
    post:
      tags: [Simulations]
      operationId: stepSimulation
      summary: Atomically simulate the current hour and advance by one hour
      description: >-
        In strict mode, If-Match must equal the current resource ETag for a new step_id. Local
        Compose relaxes this precondition. A cached step_id is resolved first: an identical
        normalized body returns the original response and ETag even though the resource has
        advanced; a different body returns step_id_reused.
      parameters:
        - name: simulation_id
          in: path
          required: true
          description: Planner-assigned simulation identifier.
          schema:
            $ref: '#/components/schemas/SimulationID'
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepRequest'
            examples:
              allocation:
                value:
                  step_id: a04ea33b-b91a-4faa-a0b5-f2869efbdf17
                  actions:
                    - channel_id: social_1
                      budget_cap: '1500.000000'
      responses:
        '200':
          description: >-
            Step committed, or the cached response for an identical step_id retry. Observations are
            sorted by channel_id and cover every configured channel.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Report whether the process can serve HTTP
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Report whether config is valid and mutations can be accepted
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          description: Service is not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    IfMatchRequired:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        pattern: '^"[0-9]+-[a-f0-9]{16}"$'
      description: Strong ETag from the latest state response; required only in strict mode.
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: Required when resetting an existing simulation in strict mode.
    IfNoneMatchOptional:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        enum: ['*']
      description: Must be `*` when creating a new simulation in strict mode.
  headers:
    ETag:
      required: true
      schema:
        type: string
        pattern: '^"[0-9]+-[a-f0-9]{16}"$'
      description: Strong revision and state digest validator.
  schemas:
    WorldMetadata:
      type: object
      additionalProperties: false
      required: [engine_version, world_config_digest, currency, channel_ids]
      properties:
        engine_version:
          type: string
          minLength: 1
        world_config_digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        channel_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ChannelID'
    Int64String:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)$'
      description: Signed 64-bit integer encoded as decimal text.
    Money:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
      description: Non-negative decimal amount with at most six fractional digits.
    Hour:
      type: string
      format: date-time
      description: RFC 3339 instant aligned to an exact hour.
    SimulationConfig:
      type: object
      additionalProperties: false
      required: [world_seed, campaign_seed, start_hour, duration_hours, time_zone]
      properties:
        world_seed:
          $ref: '#/components/schemas/Int64String'
        campaign_seed:
          $ref: '#/components/schemas/Int64String'
        start_hour:
          $ref: '#/components/schemas/Hour'
        duration_hours:
          type: integer
          minimum: 1
          maximum: 2160
        time_zone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA timezone used for hourly and weekday profiles.
        disable_random_events:
          type: boolean
          default: false
          description: Disable seed-generated drift and shocks while retaining explicit scenario events.
        scenario_events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ScenarioEvent'
    ScenarioEvent:
      type: object
      additionalProperties: false
      required: [channel_id, metric, start_index, duration_hours, multiplier]
      properties:
        channel_id:
          $ref: '#/components/schemas/ChannelID'
        metric:
          type: string
          enum: [supply, cpm, ctr, cr, pause]
        start_index:
          type: integer
          minimum: 0
        duration_hours:
          type: integer
          minimum: 1
        multiplier:
          type: number
          minimum: 0
    SimulationState:
      type: object
      additionalProperties: false
      required:
        - simulation_id
        - status
        - current_hour
        - end_hour_exclusive
        - duration_hours
        - remaining_hours
        - time_zone
        - currency
        - engine_version
        - world_config_digest
        - channel_ids
      properties:
        simulation_id:
          $ref: '#/components/schemas/SimulationID'
        status:
          type: string
          enum: [active, finished]
        current_hour:
          $ref: '#/components/schemas/Hour'
        end_hour_exclusive:
          $ref: '#/components/schemas/Hour'
        duration_hours:
          type: integer
          minimum: 1
        remaining_hours:
          type: integer
          minimum: 0
        time_zone:
          type: string
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        engine_version:
          type: string
          example: sim-v0
        world_config_digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        channel_ids:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/ChannelID'
    CurrentHour:
      type: object
      additionalProperties: false
      required: [simulation_id, status, current_hour, remaining_hours]
      properties:
        simulation_id:
          $ref: '#/components/schemas/SimulationID'
        status:
          type: string
          enum: [active, finished]
        current_hour:
          $ref: '#/components/schemas/Hour'
        remaining_hours:
          type: integer
          minimum: 0
    SimulationID:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
      example: campaign-demo_1
    ChannelID:
      type: string
      pattern: '^[a-z][a-z0-9_-]{0,63}$'
    ChannelAction:
      type: object
      additionalProperties: false
      required: [channel_id, budget_cap]
      properties:
        channel_id:
          $ref: '#/components/schemas/ChannelID'
        budget_cap:
          $ref: '#/components/schemas/Money'
    StepRequest:
      type: object
      additionalProperties: false
      required: [step_id, actions]
      properties:
        step_id:
          type: string
          format: uuid
        actions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ChannelAction'
    Observation:
      type: object
      additionalProperties: false
      required:
        - channel_id
        - hour
        - requests
        - impressions
        - unique_reach
        - clicks
        - conversions
        - spend
        - ecpm
      properties:
        channel_id:
          $ref: '#/components/schemas/ChannelID'
        hour:
          $ref: '#/components/schemas/Hour'
        requests:
          type: integer
          format: int64
          minimum: 0
        impressions:
          type: integer
          format: int64
          minimum: 0
        unique_reach:
          type: integer
          format: int64
          minimum: 0
          description: Users first reached by this channel during this hour.
        clicks:
          type: integer
          format: int64
          minimum: 0
        conversions:
          type: integer
          format: int64
          minimum: 0
        spend:
          $ref: '#/components/schemas/Money'
        ecpm:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
          nullable: true
          description: Observed eCPM as decimal money, or null when impressions are zero.
    StepResponse:
      type: object
      additionalProperties: false
      required:
        - simulation_id
        - step_id
        - observed_hour
        - next_hour
        - status
        - remaining_hours
        - observations
      properties:
        simulation_id:
          $ref: '#/components/schemas/SimulationID'
        step_id:
          type: string
          format: uuid
        observed_hour:
          $ref: '#/components/schemas/Hour'
        next_hour:
          $ref: '#/components/schemas/Hour'
        status:
          type: string
          enum: [active, finished]
        remaining_hours:
          type: integer
          minimum: 0
        observations:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/Observation'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
        detail:
          type: string
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        trace_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
  responses:
    Healthy:
      description: Service is healthy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
    BadRequest:
      description: Malformed JSON, unknown field, or invalid syntax
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Simulation does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Simulation was recently deleted
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Active limit, finished run, reset conflict, or reused step_id
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: Missing or stale state precondition
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Content-Type is not application/json
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Request violates field or domain constraints
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Internal invariant failure without sensitive details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
