name: media-planner

services:
  planner:
    build:
      context: .
      dockerfile: services/planner/Dockerfile
    environment:
      PLANNER_ADDR: 0.0.0.0
      PLANNER_PORT: "8080"
      PLANNER_LOG_LEVEL: info
      PLANNER_WORLD_CONFIG: /etc/media-planner/world-config.json
    volumes:
      - ./services/simulator/configs/world-config.mediaplan.json:/etc/media-planner/world-config.json:ro
    ports:
      - 127.0.0.1:8082:8080
    expose:
      - "8080"
    networks:
      - media-planner-internal
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          memory: 32M

  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    environment:
      SIMULATOR_ADDR: :8080
      SIMULATOR_CONFIG: /etc/media-planner/world-config.json
      SIMULATOR_LOG_LEVEL: info
      SIMULATOR_RELAX_PRECONDITIONS: "true"
    volumes:
      - ./services/simulator/configs/world-config.audience.json:/etc/media-planner/world-config.json:ro
    ports:
      - 127.0.0.1:8080:8080
    expose:
      - "8080"
    networks:
      - media-planner-internal
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "/simulator", "healthcheck", "--url", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 32M

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    ports:
      - 127.0.0.1:8081:8080
    expose:
      - "8080"
    networks:
      - media-planner-internal
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 16M

networks:
  media-planner-internal:
