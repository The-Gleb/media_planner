[project]
name = "media-planner-service"
version = "0.1.0"
description = "Stateless deterministic budget planner"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.141.0",
  "pydantic==2.13.0",
  "uvicorn==0.52.0",
]

[dependency-groups]
dev = [
  "httpx2==2.12.0",
  "hypothesis==6.151.9",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.15.7",
]

[project.scripts]
planner = "planner.transport.http.app:run"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["performance: bounded full-plan performance checks"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["planner"]
